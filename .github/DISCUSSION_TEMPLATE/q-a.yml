title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/troubleshooting.md](https://github.com/zorak1103/ha-mcp/blob/main/docs/troubleshooting.md) first — most connection/WebSocket questions are answered there.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ha-mcp version
      placeholder: v2026.8.3
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.1

  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - Cline
        - opencode
        - Other

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
