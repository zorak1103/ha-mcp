title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that ha-mcp doesn't support well today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Rough idea
      description: A new tool/action, a change to an existing one, anything.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools or workarounds you've tried instead.
