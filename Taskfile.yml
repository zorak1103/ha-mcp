# https://taskfile.dev
version: "3"

tasks:
  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    desc: Build the ha-mcp binary
    cmds:
      - go build -o ha-mcp{{exeExt}} ./cmd/ha-mcp

  # ──────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────
  test:
    desc: Run unit tests (no race detector, Windows-safe)
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with race detector (requires CGO_ENABLED=1 and a C compiler, e.g. Linux/CI or Windows with MinGW gcc)
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  test:integration:
    desc: Run integration tests (requires HA_INTEGRATION_TEST_URL and HA_INTEGRATION_TEST_TOKEN)
    cmds:
      - go test -timeout=30m -tags=integration -v ./internal/handlers/integration/...

  test:coverage:
    desc: Run tests with race detector, generate coverage, and enforce per-file 80% threshold
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - bash scripts/check-coverage.sh coverage.out 80

  # ──────────────────────────────────────────────
  # Mutation Testing
  # ──────────────────────────────────────────────
  gremlins:
    desc: Run mutation testing with gremlins unleash (via Docker, persistent Go caches)
    cmds:
      - task: gremlins:cache:init
      # renovate: datasource=docker depName=gogremlins/gremlins
      # Persistent Go caches cut ~60-100s of toolchain download + cold compile
      # per run; the explicit timeout-coefficient keeps the derived per-mutant
      # timeout above real test time when the coverage phase itself is cached
      # (a fast coverage phase otherwise shrinks the ceiling and causes mass
      # false TIMED OUT results).
      - docker run --rm -v "{{.TASKFILE_DIR}}:/app" -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build -w /app -e GOTOOLCHAIN=auto gogremlins/gremlins:0.6.0 gremlins unleash . --timeout-coefficient 60

  gremlins:cache:init:
    desc: One-time setup of the persistent Go caches for gremlins (idempotent)
    cmds:
      - docker volume create gremlins-gopkg
      - docker volume create gremlins-gocache
      # The image runs as uid 1000; named volumes mount root-owned, so grant
      # access once and leave a marker to keep repeat runs cheap.
      - docker run --rm -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build --user root --entrypoint sh gogremlins/gremlins:0.6.0 -c "test -f /go/pkg/.ha-mcp-cache-ready || (chown -R 1000:1000 /go/pkg /home/nonroot/.cache/go-build && touch /go/pkg/.ha-mcp-cache-ready)"

  gremlins:pkg:
    desc: Mutation-test one package with the full suite per mutant (-i), e.g. `task gremlins:pkg -- ./internal/jsonpatch`
    cmds:
      - task: gremlins:cache:init
      # renovate: datasource=docker depName=gogremlins/gremlins
      # Non-integration gremlins can misreport kill status for a package's
      # mutants; -i runs the complete suite per mutant and is authoritative.
      - docker run --rm -v "{{.TASKFILE_DIR}}:/app" -v gremlins-gopkg:/go/pkg -v gremlins-gocache:/home/nonroot/.cache/go-build -w /app -e GOTOOLCHAIN=auto gogremlins/gremlins:0.6.0 gremlins unleash {{.CLI_ARGS}} -i --timeout-coefficient 60

  gremlins:install:
    desc: Install the gremlins binary locally for native use (tracked by Renovate)
    cmds:
      # renovate: datasource=go depName=github.com/go-gremlins/gremlins
      - go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

  # ──────────────────────────────────────────────
  # Lint & Format
  # ──────────────────────────────────────────────
  lint:
    desc: Run golangci-lint (unit code)
    cmds:
      - golangci-lint run --timeout=5m ./...

  lint:integration:
    desc: Run golangci-lint on integration test code
    cmds:
      - golangci-lint run --timeout=5m --build-tags=integration ./internal/handlers/integration/...

  lint:install:
    desc: Install/upgrade golangci-lint to the pinned version CI uses (run after cloning or upgrading your local Go toolchain)
    cmds:
      # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

  fmt:
    desc: Check Go formatting (report unformatted files)
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted:"
          echo "$unformatted"
          echo ""
          echo "Run 'task fmt:fix' to auto-fix formatting"
          exit 1
        fi
        echo "All files are properly formatted"

  fmt:fix:
    desc: Auto-fix Go formatting
    cmds:
      - gofmt -w .

  # ──────────────────────────────────────────────
  # Security & Analysis
  # ──────────────────────────────────────────────
  vulncheck:
    desc: Run govulncheck security scanner
    cmds:
      - govulncheck ./...

  deadcode:
    desc: Run dead code detection (requires deadcode tool)
    cmds:
      - deadcode -test ./...

  # ──────────────────────────────────────────────
  # Dev
  # ──────────────────────────────────────────────
  run:
    desc: Run the ha-mcp server (set HA_URL and HA_TOKEN env vars)
    cmds:
      - go run ./cmd/ha-mcp

  release:snapshot:
    desc: Build a local snapshot release (does not publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  # ──────────────────────────────────────────────
  # Setup
  # ──────────────────────────────────────────────
  install-hooks:
    desc: Install git hooks (run once after cloning)
    cmds:
      - git config core.hooksPath .githooks
      - chmod +x .githooks/pre-commit .githooks/pre-push || true
      - echo "Git hooks installed. pre-commit auto-fixes gofmt; pre-push runs go vet + golangci-lint."
