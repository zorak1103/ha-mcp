# ha-mcp Configuration Example
# Copy this file to config.yaml and adjust values

# Home Assistant connection settings
homeassistant:
  # URL of your Home Assistant instance (required)
  # Examples:
  #   - http://homeassistant.local:8123
  #   - http://192.168.1.100:8123
  #   - https://your-ha-domain.duckdns.org
  url: "http://homeassistant.local:8123"

  # Long-Lived Access Token (OPTIONAL)
  # Generate at: Home Assistant → Profile → Long-Lived Access Tokens
  #
  # Authentication options:
  # 1. Per-request (recommended): MCP clients send token via Authorization header
  #    No token needed here - each client provides their own token.
  #
  # 2. Default token (development): Configure token here for backwards compatibility.
  #    Requests without Authorization header will use this token.
  #
  # If set, keep this secret! Do not commit to version control.
  # token: "your-long-lived-access-token"

  # Request timeout in seconds (optional, default: 30)
  timeout: 30

  # REST API client settings (used for delete operations and some queries)
  rest:
    # Rate limit: requests per second (0 = unlimited, default: 10)
    rate_limit: 10
    # Burst size: maximum burst of requests allowed (default: 5)
    rate_burst: 5
    # Retry settings for transient failures. GET/HEAD requests retry on 429,
    # 500/502/503/504 and network errors (not client timeouts); other methods
    # (create/update/delete, flow steps, template render) retry only on 429 and
    # connection-setup (dial) failures, because replaying them after a 5xx or
    # timeout could run a write twice.
    # Max retry attempts (0 = no retries, default: 3)
    max_retries: 3
    # Initial delay between retries in milliseconds (default: 100)
    # A delay of 0 or less falls back to the default
    retry_initial_delay_ms: 100
    # Maximum delay between retries in milliseconds (default: 5000)
    # A value below the initial delay is raised to the initial delay
    retry_max_delay_ms: 5000

  # WebSocket client settings (used for most operations)
  websocket:
    # Retry settings for transient command failures (bound the retries of a single command)
    # Max retry attempts (0 = no retries, default: 3)
    max_retries: 3
    # Initial delay between retries in milliseconds (default: 100)
    # A delay of 0 or less falls back to the default
    retry_initial_delay_ms: 100
    # Maximum delay between retries in milliseconds (default: 5000)
    # A value below the initial delay is raised to the initial delay
    retry_max_delay_ms: 5000

  # Post-mutation state polling settings
  # After create/update/delete operations, ha-mcp polls entity state to confirm changes
  wait:
    # Maximum time to wait for entity state change confirmation in milliseconds (default: 5000)
    wait_timeout_ms: 5000
    # Polling interval for checking state changes in milliseconds (default: 100)
    wait_poll_interval_ms: 100

# MCP Server settings
server:
  # Port for the MCP HTTP server
  port: 8080

  # Host to bind to (optional, default: localhost)
  # Use "0.0.0.0" to listen on all interfaces
  host: "localhost"

  # Read-only mode: blocks all write operations (default: false)
  # Convenience flag equivalent to: tool_filter.blacklist: ["*:write"]
  read_only: false

  # Tool filter: control which tools and actions are allowed
  # Whitelist and blacklist cannot both be non-empty
  tool_filter:
    # Whitelist: if non-empty, ONLY these tools/actions are allowed
    # Examples:
    #   - "get_state"                    # Allow entire tool
    #   - "manage_automation:list"       # Allow specific action
    #   - "manage_automation:get"        # Allow specific action
    #   - "get_*"                        # Allow all get_* tools
    whitelist: []

    # Blacklist: block specific tools/actions (only if whitelist is empty)
    # Examples:
    #   - "call_service"                 # Block entire tool
    #   - "manage_automation:delete"     # Block specific action
    #   - "manage_*:delete"              # Block delete action across all manage_* tools
    #   - "*:write"                      # Block all write operations (same as read_only: true)
    blacklist: []

# Logging settings (optional)
logging:
  # Log level: trace, debug, info, warn, error
  # TRACE: Full request/response bodies (very verbose)
  # DEBUG: Detailed debugging information
  # INFO:  General operational information (default)
  # WARN:  Warnings only
  # ERROR: Errors only
  level: "info"

# Authentication
# -------------
# MCP clients should send the Home Assistant token in the Authorization header:
#
#   Authorization: Bearer <your-ha-access-token>
#
# Example MCP client configuration (Claude Desktop):
#   {
#     "mcpServers": {
#       "homeassistant": {
#         "type": "http",
#         "url": "http://localhost:8080",
#         "headers": {
#           "Authorization": "Bearer ${HA_TOKEN}"
#         }
#       }
#     }
#   }
#
# Example MCP client configuration (Cline):
#   {
#     "servers": {
#       "ha-mcp": {
#         "url": "http://localhost:8080",
#         "headers": {
#           "Authorization": "Bearer your-ha-access-token"
#         }
#       }
#     }
#   }
